[binaries]
c = ['clang', '--target=x86_64-unknown-blockos']
cpp = ['clang++', '--target=x86_64-unknown-blockos']
ar = 'llvm-ar'
strip = 'llvm-strip'
ranlib = 'llvm-ranlib'
ld = 'ld.lld'
objcopy = 'llvm-objcopy'
pkgconfig = 'pkg-config'

[built-in options]
c_std = 'c11'
cpp_std = 'c++17'
b_lto = true
c_args = ['--target=x86_64-unknown-blockos']
cpp_args = ['--target=x86_64-unknown-blockos']
c_link_args = ['--target=x86_64-unknown-blockos']
cpp_link_args = ['--target=x86_64-unknown-blockos']

[host_machine]
system = 'blockos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '/opt/blockos/sysroot'
